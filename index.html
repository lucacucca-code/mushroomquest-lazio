<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FungiCast Lazio</title>

  <!-- PWA Manifest & Colors -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Tailwind CSS & Leaflet CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    #map { height: 100vh; width: 100vw; }
    
    /* Marker personalizzato con percentuale scritta dentro */
    .score-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #ffffff;
      font-weight: bold;
      font-size: 10px;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      text-shadow: 0px 1px 2px rgba(0,0,0,0.8);
      text-align: center;
    }

    .no-data-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      background: rgba(239, 68, 68, 0.2);
      border: 2px solid #ef4444;
      border-radius: 50%;
      width: 30px !important;
      height: 30px !important;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- Header Overlay -->
  <div class="absolute top-4 left-4 right-4 z-[1000] bg-slate-900/90 backdrop-blur-md border border-slate-700/50 p-4 rounded-2xl shadow-xl">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🍄</span>
        <div>
          <h1 class="font-bold text-lg leading-tight text-emerald-400">FungiCast Lazio</h1>
          <p class="text-xs text-slate-400">Mappa probabilità funghi e dettaglio indicatori</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="refreshData()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition">
          🔄 Aggiorna
        </button>
        <button onclick="logoutPIN()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 px-2.5 py-1.5 rounded-lg text-xs font-semibold shadow transition" title="Blocca App">
          🔒 Esci
        </button>
      </div>
    </div>
  </div>

  <!-- Legenda in Basso a Sinistra -->
  <div class="absolute bottom-6 left-4 z-[1000] bg-slate-900/90 backdrop-blur-md border border-slate-700/50 p-3 rounded-xl shadow-xl text-xs space-y-1.5 max-w-[200px]">
    <div class="font-bold text-slate-300 mb-1 border-b border-slate-700 pb-1">Legenda Probabilità</div>
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></span>
      <span>81 - 100% (Eccellente)</span>
    </div>
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-emerald-600"></span>
      <span>61 - 80% (Buono)</span>
    </div>
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-amber-500"></span>
      <span>41 - 60% (Medio)</span>
    </div>
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-orange-500"></span>
      <span>21 - 40% (Basso)</span>
    </div>
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-red-600"></span>
      <span>0 - 20% (Molto Basso)</span>
    </div>
    <div class="flex items-center space-x-2 pt-1 border-t border-slate-800">
      <span>🚫</span>
      <span class="text-slate-400">Dati non disponibili</span>
    </div>
  </div>

  <!-- Map Container -->
  <div id="map" class="z-0"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registrato:', err));
    }

    // Imposta qui il tuo PIN segreto
    const PIN_CORRETTO = "5972";

    function verificaAccesso() {
      // Controlla se l'utente ha già inserito il PIN in precedenza nel telefono
      if (localStorage.getItem("fungicast_auth") === "true") {
        initMap(); // PIN già salvato, carica la mappa direttamente
        return;
      }

      const pinInserito = prompt("🔒 Inserisci il PIN per accedere a FungiCast:");
      
      if (pinInserito === PIN_CORRETTO) {
        localStorage.setItem("fungicast_auth", "true"); // Ricorda l'accesso sul telefono
        initMap();
      } else {
        alert("❌ PIN errato! Accesso negato.");
        document.body.innerHTML = `
          <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#0f172a; color:white; font-family:sans-serif; text-align:center; padding:20px;">
            <span style="font-size:50px; margin-bottom:10px;">🔒</span>
            <h2>Accesso Riservato</h2>
            <p style="color:#94a3b8; font-size:14px; margin-top:8px;">Riavvia l'app per inserire nuovamente il PIN.</p>
          </div>
        `;
      }
    }

    function logoutPIN() {
      localStorage.removeItem("fungicast_auth");
      location.reload();
    }

    const locations = [
      // Capoluoghi
      { name: "Roma", lat: 41.9028, lon: 12.4964, type: "Provincia" },
      { name: "Viterbo", lat: 42.4174, lon: 12.1047, type: "Provincia" },
      { name: "Frosinone", lat: 41.6400, lon: 13.3511, type: "Provincia" },
      { name: "Latina", lat: 41.4676, lon: 12.9036, type: "Provincia" },
      { name: "Rieti", lat: 42.4042, lon: 12.8628, type: "Provincia" },

      // Tuscia & Viterbese
      { name: "Oriolo Romano", lat: 42.1581, lon: 12.1363, type: "Comune" },
      { name: "Manziana", lat: 42.1306, lon: 12.1294, type: "Comune" },
      { name: "Allumiere (Tolfa)", lat: 42.1561, lon: 11.9056, type: "Comune" },
      { name: "Soriano nel Cimino", lat: 42.4181, lon: 12.2333, type: "Comune" },
      { name: "Vejano", lat: 42.2183, lon: 12.0967, type: "Comune" },

      // Castelli Romani & Lepini
      { name: "Rocca Priora (Vivaro)", lat: 41.7869, lon: 12.7611, type: "Comune" },
      { name: "Artena", lat: 41.7417, lon: 12.9133, type: "Comune" },
      { name: "Velletri", lat: 41.6867, lon: 12.7783, type: "Comune" },
      { name: "Palestrina", lat: 41.8389, lon: 12.8911, type: "Comune" },

      // Tiburtina & Simbruini
      { name: "Tivoli", lat: 41.9608, lon: 12.7989, type: "Comune" },
      { name: "Subiaco (Simbruini)", lat: 41.9256, lon: 13.0944, type: "Comune" },
      { name: "Monte Livata", lat: 41.9328, lon: 13.1603, type: "Località" },
      { name: "Pisoniano", lat: 41.9078, lon: 12.9575, type: "Comune" },
      { name: "Bosco di Gattacieca (Mentana)", lat: 42.0292, lon: 12.6681, type: "Riserva" },

      // Reatino & Sabina
      { name: "Montenero Sabino", lat: 42.2803, lon: 12.8144, type: "Comune" },
      { name: "Amatrice", lat: 42.6289, lon: 13.2942, type: "Comune" },
      { name: "Leonessa", lat: 42.5658, lon: 12.9619, type: "Comune" },

      // Ciociaria & Basso Lazio
      { name: "Fiuggi", lat: 41.7919, lon: 13.2208, type: "Comune" },
      { name: "Cassino", lat: 41.4922, lon: 13.8306, type: "Comune" },
      { name: "Terracina", lat: 41.2867, lon: 13.2442, type: "Comune" },
      { name: "Formia", lat: 41.2575, lon: 13.6067, type: "Comune" }
    ];

    let map;

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([41.9, 12.7], 8);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      loadMeteoData();
    }

    async function getFungiScore(lat, lon) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&past_days=20&forecast_days=1&daily=precipitation_sum,temperature_2m_mean,wind_speed_10m_max,wind_direction_10m_dominant&timezone=Europe%2FRome`;
        const res = await fetch(url);
        if (!res.ok) return null;
        
        const data = await res.json();
        if (!data || !data.daily || !data.daily.precipitation_sum) return null;

        const rainDays = data.daily.precipitation_sum;
        const totalRain = rainDays.reduce((a, b) => a + b, 0);
        const recentTemps = data.daily.temperature_2m_mean.slice(-7);
        const avgTemp = recentTemps.reduce((a, b) => a + b, 0) / recentTemps.length;

        // 1. Punteggio Base Pioggia
        let baseRainScore = 0;
        if (totalRain >= 40 && totalRain <= 100) baseRainScore = 100;
        else if (totalRain > 20 && totalRain < 40) baseRainScore = (totalRain - 20) * 5;
        else if (totalRain > 100) baseRainScore = Math.max(0, 100 - (totalRain - 100) * 0.8);

        // 2. Timing Finestra d'Oro (-14 / -7 giorni)
        const goldenWindowRain = rainDays.slice(6, 14).reduce((a, b) => a + b, 0);
        let goldenNote = "Neutro";
        let rainScore = baseRainScore;

        if (totalRain > 15) {
          const goldenRatio = goldenWindowRain / totalRain;
          if (goldenRatio >= 0.5) {
            rainScore = Math.min(100, baseRainScore * 1.20);
            goldenNote = "🔥 Ottimale (+20%)";
          } else if (goldenRatio < 0.2) {
            rainScore = baseRainScore * 0.90;
            goldenNote = "⚠️ Non concentrata (-10%)";
          }
        }

        // 3. Punteggio Temperatura
        let tempScore = 0;
        if (avgTemp >= 12 && avgTemp <= 22) tempScore = 100;
        else if (avgTemp > 8 && avgTemp < 12) tempScore = (avgTemp - 8) * 25;
        else if (avgTemp > 22 && avgTemp < 28) tempScore = (28 - avgTemp) * 16.6;

        let combinedScore = (rainScore * 0.6) + (tempScore * 0.4);

        // 4. Impatto Vento
        const recentWindsSpeed = data.daily.wind_speed_10m_max.slice(-7);
        const recentWindsDir = data.daily.wind_direction_10m_dominant.slice(-7);
        const avgWindSpeed = recentWindsSpeed.reduce((a, b) => a + b, 0) / recentWindsSpeed.length;
        const avgWindDir = recentWindsDir.reduce((a, b) => a + b, 0) / recentWindsDir.length;

        const isDryWind = (avgWindDir >= 315 || avgWindDir <= 67);
        const isHumidWind = (avgWindDir > 135 && avgWindDir < 247);
        let windNote = "Moderato / Neutro";

        if (avgWindSpeed > 20 && isDryWind) {
          combinedScore = combinedScore * 0.82;
          windNote = "💨 Vento forte secco (-18%)";
        } else if (avgWindSpeed <= 12 || isHumidWind) {
          combinedScore = Math.min(100, combinedScore * 1.08);
          windNote = "🍃 Vento debole/umido (+8%)";
        }

        const finalScore = Math.min(100, Math.max(0, Math.round(combinedScore)));

        return { 
          totalRain: Math.round(totalRain), 
          goldenWindowRain: Math.round(goldenWindowRain),
          goldenNote: goldenNote,
          avgTemp: Math.round(avgTemp), 
          tempScore: Math.round(tempScore),
          rainScore: Math.round(rainScore),
          windSpeed: Math.round(avgWindSpeed),
          windNote: windNote,
          score: finalScore 
        };

      } catch (e) {
        return null;
      }
    }

    async function loadMeteoData() {
      for (const loc of locations) {
        const data = await getFungiScore(loc.lat, loc.lon);

        if (!data) {
          const noDataIcon = L.divIcon({
            className: 'custom-div-icon',
            html: `<div class="no-data-icon">🚫</div>`,
            iconSize: [30, 30],
            iconAnchor: [15, 15]
          });

          L.marker([loc.lat, loc.lon], { icon: noDataIcon })
            .addTo(map)
            .bindPopup(`
              <div class="text-slate-900 p-1">
                <h3 class="font-bold text-sm text-red-600">${loc.name}</h3>
                <p class="text-xs text-slate-600 mt-1">🚫 Dati meteo non disponibili o non aggiornati.</p>
              </div>
            `);
          continue;
        }

        // Colori in 5 fasce
        let color = '#dc2626'; // Rosso
        let labelText = "Molto Basso";
        if (data.score > 20 && data.score <= 40) { color = '#f97316'; labelText = "Basso"; }
        else if (data.score > 40 && data.score <= 60) { color = '#f59e0b'; labelText = "Medio"; }
        else if (data.score > 60 && data.score <= 80) { color = '#16a34a'; labelText = "Buono"; }
        else if (data.score > 80) { color = '#34d399'; labelText = "Eccellente"; }

        const size = loc.type === "Provincia" ? 34 : 28;

        // Marker personalizzato con il numero % dentro
        const markerIcon = L.divIcon({
          className: 'custom-score-icon',
          html: `<div class="score-marker" style="background-color: ${color}; width: ${size}px; height: ${size}px;">${data.score}%</div>`,
          iconSize: [size, size],
          iconAnchor: [size/2, size/2]
        });

        const marker = L.marker([loc.lat, loc.lon], { icon: markerIcon }).addTo(map);

        // Popup dettagliato con scomposizione dello Score
        marker.bindPopup(`
          <div class="text-slate-900 p-1 max-w-[220px]">
            <h3 class="font-bold text-sm border-b pb-1 mb-2">${loc.name} <span class="text-[10px] text-slate-500">(${loc.type})</span></h3>
            
            <div class="bg-slate-100 p-2 rounded-lg mb-2 text-center">
              <div class="text-xs text-slate-600">Probabilità Totale</div>
              <div class="text-xl font-black" style="color:${color}">${data.score}% (${labelText})</div>
            </div>

            <div class="text-xs space-y-1.5 text-slate-700">
              <p><b>🌧️ Pioggia 20gg:</b> ${data.totalRain} mm <span class="text-[10px] text-slate-500">(Score: ${data.rainScore}%)</span></p>
              <p><b>⏳ Finestra -14/-7gg:</b> ${data.goldenWindowRain} mm<br><span class="text-[10px] font-semibold text-emerald-700">${data.goldenNote}</span></p>
              <p><b>🌡️ Temp. Media:</b> ${data.avgTemp} °C <span class="text-[10px] text-slate-500">(Score: ${data.tempScore}%)</span></p>
              <p><b>💨 Vento:</b> ${data.windSpeed} km/h<br><span class="text-[10px] font-semibold text-slate-600">${data.windNote}</span></p>
            </div>
          </div>
        `);
      }
    }

    function refreshData() {
      map.eachLayer(layer => { 
        if (layer instanceof L.Marker) {
          map.removeLayer(layer);
        }
      });
      loadMeteoData();
    }

    window.onload = verificaAccesso;
  </script>
</body>
</html>
