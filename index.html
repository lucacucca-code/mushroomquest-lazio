<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fungoradar Italia</title>

  <!-- PWA Manifest & Colors -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Tailwind CSS & Leaflet CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Flatpickr CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/it.js"></script>

  <!-- Database Esterno dei Comuni -->
  <script src="comuni_italia.js"></script>

  <style>
    #map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }
    
    .flatpickr-calendar.dark {
      background: #1e293b !important;
      border: 1px solid #475569 !important;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important;
    }
    .flatpickr-day.selected {
      background: #059669 !important;
      border-color: #059669 !important;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- Header Overlay -->
  <div class="absolute top-4 left-4 right-4 z-[1000] bg-slate-900/90 backdrop-blur-md border border-slate-700/50 p-4 rounded-2xl shadow-xl">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🍄</span>
        <div>
          <h1 class="font-bold text-lg leading-tight text-emerald-400">Fungoradar Italia</h1>
          <p id="status-text" class="text-[10px] text-slate-400">Modello con Card Storiche a Blocco</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        
        <!-- Date Picker con Icona Calendario -->
        <div class="relative flex items-center">
          <input type="text" id="targetDate" class="bg-slate-800 text-emerald-400 border border-slate-600 rounded-lg pl-2 pr-8 py-1.5 text-xs font-bold shadow focus:outline-none focus:ring-2 focus:ring-emerald-500 w-[125px] cursor-pointer text-center" readonly placeholder="Seleziona data">
          <svg class="w-4 h-4 text-emerald-400 absolute right-2.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
        </div>
        
        <!-- Pulsante Radar Pioggia Live -->
        <button onclick="toggleRadar()" id="radar-btn" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 p-1.5 rounded-lg text-sm font-semibold shadow transition" title="Attiva/Disattiva Radar Pioggia Live">
          📡
        </button>

        <button onclick="refreshData()" class="bg-emerald-600 hover:bg-emerald-500 text-white p-1.5 rounded-lg text-sm font-semibold shadow transition" title="Ricarica Dati">
          🔄
        </button>
        <button onclick="logoutPIN()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 p-1.5 rounded-lg text-sm font-semibold shadow transition" title="Blocca App">
          🔒
        </button>
      </div>
    </div>
  </div>

  <!-- Legenda in Basso a Sinistra -->
  <div class="absolute bottom-6 left-4 z-[1000] bg-slate-900/90 backdrop-blur-md border border-slate-700/50 p-3 rounded-xl shadow-xl text-xs space-y-1.5 max-w-[200px]">
    <div class="font-bold text-slate-300 mb-1 border-b border-slate-700 pb-1">Legenda Probabilità</div>
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></span>
      <span>81 - 100% (Eccellente)</span>
    </div>
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-emerald-600"></span>
      <span>61 - 80% (Buono)</span>
    </div>
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-amber-500"></span>
      <span>41 - 60% (Medio)</span>
    </div>
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-orange-500"></span>
      <span>21 - 40% (Basso)</span>
    </div>
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-red-600"></span>
      <span>0 - 20% (Molto Basso)</span>
    </div>
  </div>

  <!-- MODAL DETTAGLI (Proposta 2: Day Cards a Blocco) -->
  <div id="details-modal" class="fixed inset-0 z-[2000] bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
      <!-- Header Modal -->
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <div>
          <h3 id="modal-title" class="font-bold text-base text-emerald-400">Analisi Dettagliata</h3>
          <p id="modal-subtitle" class="text-xs text-slate-400">Storico ultimi 10 giorni (Card a blocco)</p>
        </div>
        <button onclick="closeDetailsModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg p-1.5 text-sm font-bold">✕</button>
      </div>
      <!-- Contenitore Card Giornaliere -->
      <div id="modal-body" class="p-4 overflow-y-auto space-y-2.5 text-xs">
        <!-- Generato via JavaScript -->
      </div>
      <!-- Footer Modal -->
      <div class="p-3 border-t border-slate-800 bg-slate-950/50 text-right">
        <button onclick="closeDetailsModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition">Chiudi</button>
      </div>
    </div>
  </div>

  <!-- Map Container -->
  <div id="map" class="z-0"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(reg => {
        requestNotificationPermission();
      }).catch(err => console.log('SW errore:', err));
    }

    const PIN_CORRETTO = "1234";
    let map;
    let activeMarkers = {};
    let meteoCache = {};
    let radarLayer = null;
    let isRadarActive = false;

    function requestNotificationPermission() {
      if ('Notification' in window && Notification.permission !== 'granted') {
        Notification.requestPermission();
      }
    }

    function sendFungiAlert(locationName, recentRain) {
      if ('Notification' in window && Notification.permission === 'granted') {
        const lastAlert = localStorage.getItem(`alert_${locationName}`);
        const todayStr = new Date().toISOString().split('T')[0];

        if (lastAlert !== todayStr) {
          navigator.serviceWorker.ready.then(registration => {
            registration.showNotification("🍄 FungiCast - Allerta Crescita!", {
              body: `💧 Rilevati ${recentRain} mm di pioggia a ${locationName}!\n🌱 Fruttificazione altamente probabile tra 7-10 giorni.`,
              icon: "icon.png",
              badge: "icon.png"
            });
            localStorage.setItem(`alert_${locationName}`, todayStr);
          });
        }
      }
    }

    function initCustomCalendar() {
      try {
        const today = new Date();
        const maxDate = new Date(today.getTime() + 14 * 24 * 60 * 60 * 1000);

        flatpickr("#targetDate", {
          locale: "it",
          dateFormat: "Y-m-d",
          defaultDate: "today",
          maxDate: maxDate,
          disableMobile: true,
          onChange: function() {
            meteoCache = {};
            refreshData();
          }
        });
      } catch(e) {
        const offset = (new Date()).getTimezoneOffset() * 60000;
        document.getElementById('targetDate').value = (new Date(Date.now() - offset)).toISOString().split('T')[0];
      }
    }

    function verificaAccesso() {
      if (localStorage.getItem("fungicast_auth") === "true") {
        initCustomCalendar();
        initMap(); 
        return;
      }
      const pinInserito = prompt("🔒 Inserisci il PIN per accedere a FungiCast:");
      if (pinInserito === PIN_CORRETTO) {
        localStorage.setItem("fungicast_auth", "true");
        initCustomCalendar();
        initMap();
      } else {
        alert("❌ PIN errato!");
        document.body.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#0f172a; color:white;"><h2>Accesso Riservato</h2></div>`;
      }
    }

    function logoutPIN() {
      localStorage.removeItem("fungicast_auth");
      location.reload();
    }

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([42.5, 12.5], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(map);
      
      map.on('moveend zoomend', loadMeteoData);
      loadMeteoData();
    }

    async function toggleRadar() {
      const btn = document.getElementById('radar-btn');
      const statusText = document.getElementById("status-text");

      if (isRadarActive) {
        if (radarLayer) {
          map.removeLayer(radarLayer);
          radarLayer = null;
        }
        isRadarActive = false;
        btn.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-500');
        btn.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-600');
        statusText.innerText = "Radar disattivato";
      } else {
        statusText.innerText = "📡 Caricamento Radar Live...";
        try {
          const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
          const data = await res.json();
          if (data && data.radar && data.radar.past && data.radar.past.length > 0) {
            const latestTimestamp = data.radar.past[data.radar.past.length - 1].time;
            
            radarLayer = L.tileLayer(`https://tile.rainviewer.com/v2/radar/${latestTimestamp}/256/{z}/{x}/{y}/2/1_1.png`, {
              opacity: 0.65,
              attribution: '© RainViewer'
            }).addTo(map);

            isRadarActive = true;
            btn.classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-600');
            btn.classList.add('bg-emerald-600', 'text-white', 'border-emerald-500');
            statusText.innerText = "📡 Radar Pioggia Attivo (Live)";
          } else {
            alert("Impossibile caricare i dati del radar in questo momento.");
            statusText.innerText = "Errore caricamento radar";
          }
        } catch(e) {
          alert("Errore di connessione al servizio radar.");
          statusText.innerText = "Errore radar";
        }
      }
    }

    async function loadMeteoData() {
      const currentZoom = map.getZoom();
      const bounds = map.getBounds();
      const statusText = document.getElementById("status-text");

      if (typeof COMUNI_ITALIA === 'undefined') {
        statusText.innerText = "⚠️ Errore: comuni_italia.js non caricato";
        return;
      }

      const visibleLocs = COMUNI_ITALIA.filter(loc => {
        return currentZoom >= loc.minZoom && bounds.contains([loc.lat, loc.lon]);
      });

      if (!isRadarActive) {
        statusText.innerText = `🍄 Caricamento ${visibleLocs.length} aree...`;
      }

      await Promise.all(visibleLocs.map(async (loc) => {
        const locKey = `${loc.lat}_${loc.lon}`;
        
        if (!activeMarkers[locKey]) {
          const data = await getFungiScore(loc.lat, loc.lon, loc.alt || 300);
          if (!data) return;

          if (data.recentRain >= 30) {
            sendFungiAlert(loc.name, data.recentRain);
          }

          let color = '#dc2626'; let labelText = "Molto Basso";
          if (data.score > 20 && data.score <= 40) { color = '#f97316'; labelText = "Basso"; }
          else if (data.score > 40 && data.score <= 60) { color = '#f59e0b'; labelText = "Medio"; }
          else if (data.score > 60 && data.score <= 80) { color = '#16a34a'; labelText = "Buono"; }
          else if (data.score > 80) { color = '#34d399'; labelText = "Eccellente"; }

          const size = loc.type === "Provincia" ? 34 : 28;
          
          const markerIcon = L.divIcon({
            className: '',
            html: `<div style="background-color: ${color}; width: ${size}px; height: ${size}px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #ffffff; font-weight: bold; font-size: 10px; border: 2px solid #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.4); text-shadow: 0px 1px 2px rgba(0,0,0,0.8);">${data.score}%</div>`,
            iconSize: [size, size],
            iconAnchor: [size/2, size/2]
          });

          const marker = L.marker([loc.lat, loc.lon], { icon: markerIcon }).addTo(map).bindPopup(`
            <div class="text-slate-900 p-1 max-w-[250px]">
              <h3 class="font-bold text-sm border-b pb-1 mb-2">
                ${loc.name} 
                <span class="text-[10px] text-slate-500 font-normal">(${loc.type} - ⛰️ ${loc.alt}m slm)</span>
              </h3>
              
              <div class="bg-slate-100 p-2 rounded-lg mb-2 text-center relative">
                <div class="text-xs text-slate-600">Probabilità Calcolata</div>
                <div class="text-xl font-black" style="color:${color}">${data.score}% (${labelText})</div>
                <div class="text-[10px] mt-1 ${data.predictionColor}">${data.predictionNote}</div>
                ${data.seasonNote ? `<div class="text-[9px] mt-1 text-purple-700 font-bold bg-purple-100 p-1 rounded">${data.seasonNote}</div>` : ''}
                ${data.windDryNote ? `<div class="text-[9px] mt-1 text-red-700 font-bold bg-red-100 p-1 rounded">${data.windDryNote}</div>` : ''}
                ${data.tempMinNote ? `<div class="text-[9px] mt-1 text-amber-700 font-bold bg-amber-100 p-1 rounded">${data.tempMinNote}</div>` : ''}
                ${data.penaltyNote ? `<div class="text-[9px] mt-1 text-red-600 font-bold bg-red-100 p-1 rounded">${data.penaltyNote}</div>` : ''}
              </div>

              <div class="text-[11px] space-y-1.5 text-slate-700">
                <p><b>🌧️ Finestra d'Oro (-7 a -10gg):</b> ${data.goldenWindowRain} mm</p>
                <p><b>🌱 Umidità Suolo:</b> ${data.soilMoisture}%</p>
                <p><b>💧 Condensa Notturna:</b> ${data.dewNote}</p>
                <p><b>🌡️ Temp. Media:</b> ${data.avgTemp} °C (Min: ${data.avgMinTemp}°C)</p>
                <p><b>💨 Vento:</b> ${data.windSpeed} km/h - ${data.windNote}</p>
              </div>

              <div class="mt-3 pt-2 border-t border-slate-200 text-center">
                <button onclick="openDetailsModal('${loc.name.replace(/'/g, "\\'")}', '${locKey}')" class="bg-slate-900 hover:bg-emerald-700 text-white w-full py-1.5 px-3 rounded-lg text-xs font-bold transition shadow">
                  📊 Dettagli Storici (Card 10 Giorni)
                </button>
              </div>
            </div>
          `);

          activeMarkers[locKey] = marker;
        }
      }));

      Object.keys(activeMarkers).forEach(key => {
        const [lat, lon] = key.split('_').map(Number);
        const stillVisible = visibleLocs.some(loc => loc.lat === lat && loc.lon === lon);
        if (!stillVisible) {
          map.removeLayer(activeMarkers[key]);
          delete activeMarkers[key];
        }
      });

      if (!isRadarActive) {
        statusText.innerText = `🍄 ${visibleLocs.length} aree visibili`;
      }
    }

    // Funzione per aprire il Modal con le Day Cards (Proposta 2)
    function openDetailsModal(locationName, locKey) {
      const data = meteoCache[locKey];
      if (!data || !data.dailyHistory) {
        alert("Dettagli non ancora disponibili. Riprova tra un istante.");
        return;
      }

      document.getElementById('modal-title').innerText = `📊 Card Storiche: ${locationName}`;
      document.getElementById('modal-subtitle').innerText = `Punteggio Totale: ${data.score}% | Dati Ultimi 10 Giorni`;

      const modalBody = document.getElementById('modal-body');
      let html = `
        <div class="mb-3 p-2.5 bg-emerald-950/40 border border-emerald-800/50 rounded-xl text-[11px] text-emerald-300">
          🌿 <b>Finestra d'Oro (-7 a -10gg):</b> Le schede evidenziate in verde sono i giorni chiave in cui il micelio assorbe l'acqua per la spinta.
        </div>
        <div class="space-y-2">
      `;

      // Creazione delle Day Cards a blocco
      data.dailyHistory.forEach((day) => {
        const isGolden = day.isGolden;
        
        // Stili dinamici in base alla Finestra d'Oro
        const cardBg = isGolden 
          ? 'bg-emerald-950/40 border-emerald-500 ring-1 ring-emerald-500/50' 
          : 'bg-slate-800/50 border-slate-700/60';
        
        const badgeHtml = isGolden 
          ? '<span class="bg-emerald-600 text-white text-[9px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">🌿 Finestra d\'Oro</span>' 
          : '<span class="text-slate-400 text-[10px]">Giornata Standard</span>';

        html += `
          <div class="p-3 rounded-xl border ${cardBg} transition flex flex-col space-y-1.5 shadow-sm">
            <div class="flex items-center justify-between border-b border-slate-700/50 pb-1.5">
              <span class="font-bold text-slate-200 text-xs">📅 ${day.date}</span>
              ${badgeHtml}
            </div>
            <div class="grid grid-cols-3 gap-2 pt-1 text-center">
              <div class="bg-slate-900/60 p-1.5 rounded-lg border border-slate-800">
                <div class="text-[10px] text-slate-400">Pioggia</div>
                <div class="font-bold text-xs ${day.rain > 5 ? 'text-blue-400' : 'text-slate-300'}">🌧️ ${day.rain} mm</div>
              </div>
              <div class="bg-slate-900/60 p-1.5 rounded-lg border border-slate-800">
                <div class="text-[10px] text-slate-400">Temperature</div>
                <div class="font-bold text-xs text-slate-200">🌡️ ${day.temp}°C <span class="text-[9px] text-slate-400">(${day.tempMin}°)</span></div>
              </div>
              <div class="bg-slate-900/60 p-1.5 rounded-lg border border-slate-800">
                <div class="text-[10px] text-slate-400">Vento Max</div>
                <div class="font-bold text-xs ${day.wind > 15 ? 'text-orange-400' : 'text-slate-300'}">💨 ${day.wind} km/h</div>
              </div>
            </div>
          </div>
        `;
      });

      html += `</div>`;

      modalBody.innerHTML = html;
      document.getElementById('details-modal').classList.remove('hidden');
    }

    function closeDetailsModal() {
      document.getElementById('details-modal').classList.add('hidden');
    }

    async function getFungiScore(lat, lon, altitude = 300) {
      const targetDateStr = document.getElementById('targetDate').value;
      const cacheKey = `${lat}_${lon}_${altitude}_${targetDateStr}`;

      if (meteoCache[cacheKey]) return meteoCache[cacheKey];

      try {
        const todayObj = new Date();
        const offset = todayObj.getTimezoneOffset() * 60000;
        const localTodayStr = (new Date(todayObj - offset)).toISOString().split('T')[0];
        
        const isToday = (targetDateStr === localTodayStr);
        let url;

        const dailyParams = "precipitation_sum,temperature_2m_mean,temperature_2m_min,wind_speed_10m_max,wind_direction_10m_dominant";

        if (isToday) {
          url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&past_days=20&forecast_days=1&daily=${dailyParams}&timezone=Europe%2FRome`;
        } else {
          const tDate = new Date(targetDateStr);
          const sDate = new Date(tDate);
          sDate.setDate(sDate.getDate() - 20);
          const startStr = sDate.toISOString().split('T')[0];
          url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&start_date=${startStr}&end_date=${targetDateStr}&daily=${dailyParams}&timezone=Europe%2FRome`;
        }

        const res = await fetch(url);
        if (!res.ok) return null;
        const data = await res.json();
        
        if (!data || !data.daily || !data.daily.precipitation_sum) return null;

        let missingInfoDays = 0;
        if (!isToday) {
          data.daily.precipitation_sum.forEach(v => { if (v === null) missingInfoDays++; });
        }

        const padArray = (arr, len, fillVal) => {
          let res = arr.map(v => v === null ? fillVal : v);
          while(res.length < len) {
            res.unshift(fillVal);
            if (!isToday && fillVal === 0) missingInfoDays++; 
          }
          return res.slice(-len);
        };

        const timeDays = padArray(data.daily.time || [], 21, "2026-01-01");
        const rainDays = padArray(data.daily.precipitation_sum, 21, 0);
        const tempDays = padArray(data.daily.temperature_2m_mean, 21, 15);
        const tempMinDays = padArray(data.daily.temperature_2m_min, 21, 10);
        const windSpeedDays = padArray(data.daily.wind_speed_10m_max, 21, 0);
        const windDirDays = padArray(data.daily.wind_direction_10m_dominant, 21, 0);

        const totalRain = rainDays.reduce((a, b) => a + b, 0);
        
        // Finestra d'Oro: da -7 a -10 giorni (indici 10 a 13)
        const goldenWindowRain = rainDays.slice(10, 14).reduce((a, b) => a + b, 0); 
        const recentRain = rainDays.slice(17, 21).reduce((a, b) => a + b, 0); 

        const recentTemps = tempDays.slice(-7);
        const avgTemp = recentTemps.reduce((a, b) => a + b, 0) / recentTemps.length;

        const recentMinTemps = tempMinDays.slice(-7);
        const avgMinTemp = recentMinTemps.reduce((a, b) => a + b, 0) / recentMinTemps.length;

        const postGoldenMin = tempMinDays.slice(16, 21);
        const avgPostGoldenMin = postGoldenMin.reduce((a, b) => a + b, 0) / postGoldenMin.length;

        const soilMoistureEst = Math.min(100, Math.max(10, Math.round((totalRain * 0.4 + recentRain * 1.5) / 1.2)));

        let goldenScore = 0;
        if (goldenWindowRain >= 25 && goldenWindowRain <= 70) goldenScore = 100;
        else if (goldenWindowRain > 5 && goldenWindowRain < 25) goldenScore = (goldenWindowRain - 5) * 5;
        else if (goldenWindowRain > 70) goldenScore = Math.max(0, 100 - (goldenWindowRain - 70));

        let soilScore = Math.min(100, soilMoistureEst * 1.5);

        let minIdealTemp = 12;
        let maxIdealTemp = 20;

        if (altitude >= 1000) {
          minIdealTemp = 10;
          maxIdealTemp = 17;
        } else if (altitude <= 500) {
          minIdealTemp = 13;
          maxIdealTemp = 22;
        }

        let tempScore = 0;
        if (avgTemp >= minIdealTemp && avgTemp <= maxIdealTemp) {
          tempScore = 100;
        } else if (avgTemp < minIdealTemp) {
          tempScore = Math.max(0, 100 - (minIdealTemp - avgTemp) * 20);
        } else if (avgTemp > maxIdealTemp) {
          tempScore = Math.max(0, 100 - (avgTemp - maxIdealTemp) * 18);
        }

        let totalRainScore = 0;
        if (totalRain >= 40 && totalRain <= 150) totalRainScore = 100;
        else if (totalRain > 10 && totalRain < 40) totalRainScore = (totalRain - 10) * 3.3;

        let combinedScore = (goldenScore * 0.45) + (soilScore * 0.20) + (tempScore * 0.20) + (totalRainScore * 0.15);

        const recent3WindsSpeed = windSpeedDays.slice(-3);
        const recent3WindsDir = windDirDays.slice(-3);
        const avgRecentWindSpeed = recent3WindsSpeed.reduce((a, b) => a + b, 0) / recent3WindsSpeed.length;
        const avgRecentWindDir = recent3WindsDir.reduce((a, b) => a + b, 0) / recent3WindsDir.length;

        const isDryWindRecent = (avgRecentWindDir >= 315 || avgRecentWindDir <= 67);
        let windNote = "🌬️ Vento neutro";
        let windDryNote = "";

        if (avgRecentWindSpeed > 14 && isDryWindRecent) {
          const dryingPenalty = (altitude <= 600) ? 0.55 : 0.70;
          combinedScore = combinedScore * dryingPenalty; 
          windNote = "💨 Tramontana secca recente";
          windDryNote = `⚠️ Vento secco post-pioggia: suolo superficiale disidratato (-${Math.round((1-dryingPenalty)*100)}%)`;
        } else if (avgRecentWindSpeed <= 12) {
          combinedScore = Math.min(100, combinedScore * 1.10); 
          windNote = "🍃 Vento debole protetto (+10%)";
        }

        let dewNote = "Neutro";
        if (avgPostGoldenMin >= 10 && avgPostGoldenMin <= 16) {
          combinedScore = Math.min(100, combinedScore * 1.10);
          dewNote = "Ottimale (+10%)";
        } else if (avgPostGoldenMin < 5) {
          combinedScore = combinedScore * 0.85;
          dewNote = "Scarso/Secco (-15%)";
        }

        let tempMinNote = "";
        const minTempThreshold = (altitude >= 1000) ? 10 : 14;
        if (avgMinTemp < minTempThreshold) {
          combinedScore = combinedScore * 0.85;
          tempMinNote = `❄️ Notte fredda per la quota (${Math.round(avgMinTemp)}°C) (-15%)`;
        }

        const targetDateObj = new Date(targetDateStr);
        const targetMonth = targetDateObj.getMonth() + 1;
        let seasonNote = "";
        let isFavorable = true;

        if (altitude >= 1000) {
          if (targetMonth < 7 || targetMonth > 10) {
            isFavorable = false;
            if (targetMonth === 11) seasonNote = `❄️ Novembre in montagna: freddo bloccante (-70%)`;
            else seasonNote = `⚠️ Fuori stagione di montagna (Mese ${targetMonth}) (-80%)`;
          }
        } else if (altitude <= 500) {
          if (targetMonth < 5 || targetMonth > 11 || targetMonth === 7) {
            isFavorable = false;
            seasonNote = `⚠️ Fuori stagione a bassa quota (Mese ${targetMonth}) (-80%)`;
          } else if (targetMonth === 8) {
            combinedScore = combinedScore * 0.70;
            seasonNote = `☀️ Caldo estivo a bassa quota (-30%)`;
          }
        } else {
          if ((targetMonth < 5 || targetMonth > 6) && (targetMonth < 8 || targetMonth > 11)) {
            isFavorable = false;
            seasonNote = `⚠️ Fuori stagione biologica (Mese ${targetMonth}) (-80%)`;
          }
        }

        if (!isFavorable && targetMonth !== 8) {
          combinedScore = combinedScore * 0.20;
        }

        let penaltyNote = "";
        if (!isToday && missingInfoDays > 0) {
          const penalty = missingInfoDays * 5;
          combinedScore -= penalty;
          penaltyNote = `⚠️ Incertezza previsione: penalità -${penalty}%`;
        }

        const finalScore = Math.min(100, Math.max(0, Math.round(combinedScore)));

        let predictionNote = "Fase stazionaria / Attesa";
        let predictionColor = "text-slate-500";
        if (recentRain > 30 && goldenWindowRain < 20) {
          predictionNote = "💧 Suolo appena bagnato: boom atteso tra 7-10 gg";
          predictionColor = "text-blue-600 font-bold";
        } else if (goldenWindowRain >= 25 && finalScore > 60) {
          predictionNote = "🍄 Piena Finestra di Fruttificazione!";
          predictionColor = "text-emerald-600 font-bold";
        } else if (totalRain < 15) {
          predictionNote = "🏜️ Terreno secco, in attesa di piogge.";
          predictionColor = "text-orange-600";
        }

        // COSTRUIAMO LO STORICO DEGLI ULTIMI 10 GIORNI SOTTO FORMA DI CARD
        const dailyHistory = [];
        for (let i = 11; i < 21; i++) {
          dailyHistory.push({
            date: timeDays[i] || `Giorno ${i}`,
            rain: Math.round(rainDays[i] * 10) / 10,
            temp: Math.round(tempDays[i]),
            tempMin: Math.round(tempMinDays[i]),
            wind: Math.round(windSpeedDays[i]),
            isGolden: (i >= 10 && i <= 13) // Gli indici della Finestra d'Oro (-7 a -10gg)
          });
        }

        const result = { 
          totalRain: Math.round(totalRain), 
          recentRain: Math.round(recentRain),
          goldenWindowRain: Math.round(goldenWindowRain),
          soilMoisture: soilMoistureEst,
          dewNote,
          predictionNote, predictionColor, penaltyNote, tempMinNote, seasonNote, windDryNote,
          avgTemp: Math.round(avgTemp), avgMinTemp: Math.round(avgMinTemp),
          windSpeed: Math.round(avgRecentWindSpeed), windNote,
          score: finalScore,
          dailyHistory
        };

        meteoCache[cacheKey] = result;
        return result;

      } catch (e) { return null; }
    }

    function refreshData() {
      Object.keys(activeMarkers).forEach(key => {
        map.removeLayer(activeMarkers[key]);
      });
      activeMarkers = {};
      loadMeteoData();
    }

    window.onload = verificaAccesso;
  </script>
