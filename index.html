<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FungiCast Lazio</title>

  <!-- PWA Manifest & Colors -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Tailwind CSS & Leaflet CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Flatpickr (Calendario Popup Custom) CSS & JS (Link Aggiornati e Sicuri) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/it.js"></script>

  <style>
    /* Assicura che la mappa sia a tutto schermo e sempre sul fondo */
    #map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }
    
    .score-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #ffffff;
      font-weight: bold;
      font-size: 10px;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      text-shadow: 0px 1px 2px rgba(0,0,0,0.8);
      text-align: center;
    }

    .no-data-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      background: rgba(239, 68, 68, 0.2);
      border: 2px solid #ef4444;
      border-radius: 50%;
      width: 30px !important;
      height: 30px !important;
    }
    
    .flatpickr-calendar.dark {
      background: #1e293b !important;
      border: 1px solid #475569 !important;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important;
    }
    .flatpickr-day.selected {
      background: #059669 !important;
      border-color: #059669 !important;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- Header Overlay -->
  <div class="absolute top-4 left-4 right-4 z-[1000] bg-slate-900/90 backdrop-blur-md border border-slate-700/50 p-4 rounded-2xl shadow-xl">
    <div class="flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="text-2xl">🍄</span>
        <div>
          <h1 class="font-bold text-lg leading-tight text-emerald-400">FungiCast Lazio</h1>
          <p class="text-[10px] text-slate-400">Seleziona la data di previsione</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        
        <!-- Date Picker con Icona Calendario -->
        <div class="relative flex items-center">
          <input type="text" id="targetDate" class="bg-slate-800 text-emerald-400 border border-slate-600 rounded-lg pl-2 pr-8 py-1.5 text-xs font-bold shadow focus:outline-none focus:ring-2 focus:ring-emerald-500 w-[125px] cursor-pointer text-center" readonly placeholder="Seleziona data">
          <svg class="w-4 h-4 text-emerald-400 absolute right-2.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
        </div>
        
        <button onclick="refreshData()" class="bg-emerald-600 hover:bg-emerald-500 text-white p-1.5 rounded-lg text-sm font-semibold shadow transition" title="Ricarica Dati">
          🔄
        </button>
        <button onclick="logoutPIN()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 p-1.5 rounded-lg text-sm font-semibold shadow transition" title="Blocca App">
          🔒
        </button>
      </div>
    </div>
  </div>

  <!-- Legenda in Basso a Sinistra -->
  <div class="absolute bottom-6 left-4 z-[1000] bg-slate-900/90 backdrop-blur-md border border-slate-700/50 p-3 rounded-xl shadow-xl text-xs space-y-1.5 max-w-[200px]">
    <div class="font-bold text-slate-300 mb-1 border-b border-slate-700 pb-1">Legenda Probabilità</div>
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></span>
      <span>81 - 100% (Eccellente)</span>
    </div>
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-emerald-600"></span>
      <span>61 - 80% (Buono)</span>
    </div>
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-amber-500"></span>
      <span>41 - 60% (Medio)</span>
    </div>
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-orange-500"></span>
      <span>21 - 40% (Basso)</span>
    </div>
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-red-600"></span>
      <span>0 - 20% (Molto Basso)</span>
    </div>
  </div>

  <!-- Map Container -->
  <div id="map" class="z-0"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registrato:', err));
    }

    // Ricorda di impostare qui il tuo PIN segreto prima di caricare su GitHub
    const PIN_CORRETTO = "1234";

    function initCustomCalendar() {
      try {
        const today = new Date();
        const maxDate = new Date(today.getTime() + 14 * 24 * 60 * 60 * 1000);

        flatpickr("#targetDate", {
          locale: "it",
          dateFormat: "Y-m-d",
          defaultDate: "today",
          maxDate: maxDate,
          disableMobile: true,
          onChange: function(selectedDates, dateStr, instance) {
            refreshData();
          }
        });
      } catch(e) {
        console.error("Errore Flatpickr:", e);
        // Fallback di sicurezza: se il calendario fallisce, impostiamo la data di oggi manualmente
        const offset = (new Date()).getTimezoneOffset() * 60000;
        document.getElementById('targetDate').value = (new Date(Date.now() - offset)).toISOString().split('T')[0];
      }
    }

    function verificaAccesso() {
      if (localStorage.getItem("fungicast_auth") === "true") {
        initCustomCalendar();
        initMap(); 
        return;
      }
      const pinInserito = prompt("🔒 Inserisci il PIN per accedere a FungiCast:");
      if (pinInserito === PIN_CORRETTO) {
        localStorage.setItem("fungicast_auth", "true");
        initCustomCalendar();
        initMap();
      } else {
        alert("❌ PIN errato!");
        document.body.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#0f172a; color:white;"><h2>Accesso Riservato</h2></div>`;
      }
    }

    function logoutPIN() {
      localStorage.removeItem("fungicast_auth");
      location.reload();
    }

    const locations = [
      { name: "Roma", lat: 41.9028, lon: 12.4964, type: "Provincia" },
      { name: "Viterbo", lat: 42.4174, lon: 12.1047, type: "Provincia" },
      { name: "Frosinone", lat: 41.6400, lon: 13.3511, type: "Provincia" },
      { name: "Latina", lat: 41.4676, lon: 12.9036, type: "Provincia" },
      { name: "Rieti", lat: 42.4042, lon: 12.8628, type: "Provincia" },
      { name: "Oriolo Romano", lat: 42.1581, lon: 12.1363, type: "Comune" },
      { name: "Manziana", lat: 42.1306, lon: 12.1294, type: "Comune" },
      { name: "Allumiere (Tolfa)", lat: 42.1561, lon: 11.9056, type: "Comune" },
      { name: "Soriano nel Cimino", lat: 42.4181, lon: 12.2333, type: "Comune" },
      { name: "Vejano", lat: 42.2183, lon: 12.0967, type: "Comune" },
      { name: "Rocca Priora", lat: 41.7869, lon: 12.7611, type: "Comune" },
      { name: "Artena", lat: 41.7417, lon: 12.9133, type: "Comune" },
      { name: "Velletri", lat: 41.6867, lon: 12.7783, type: "Comune" },
      { name: "Palestrina", lat: 41.8389, lon: 12.8911, type: "Comune" },
      { name: "Tivoli", lat: 41.9608, lon: 12.7989, type: "Comune" },
      { name: "Subiaco", lat: 41.9256, lon: 13.0944, type: "Comune" },
      { name: "Monte Livata", lat: 41.9328, lon: 13.1603, type: "Località" },
      { name: "Pisoniano", lat: 41.9078, lon: 12.9575, type: "Comune" },
      { name: "Bosco Gattacieca", lat: 42.0292, lon: 12.6681, type: "Riserva" },
      { name: "Montenero Sabino", lat: 42.2803, lon: 12.8144, type: "Comune" },
      { name: "Amatrice", lat: 42.6289, lon: 13.2942, type: "Comune" },
      { name: "Leonessa", lat: 42.5658, lon: 12.9619, type: "Comune" },
      { name: "Fiuggi", lat: 41.7919, lon: 13.2208, type: "Comune" },
      { name: "Cassino", lat: 41.4922, lon: 13.8306, type: "Comune" },
      { name: "Terracina", lat: 41.2867, lon: 13.2442, type: "Comune" },
      { name: "Formia", lat: 41.2575, lon: 13.6067, type: "Comune" }
    ];

    let map;

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([41.9, 12.7], 8);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OS' }).addTo(map);
      loadMeteoData();
    }

    async function getFungiScore(lat, lon) {
      try {
        const targetDateStr = document.getElementById('targetDate').value;
        const todayObj = new Date();
        const offset = todayObj.getTimezoneOffset() * 60000;
        const localTodayStr = (new Date(todayObj - offset)).toISOString().split('T')[0];
        
        const isToday = (targetDateStr === localTodayStr);
        let url;

        if (isToday) {
          url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&past_days=20&forecast_days=1&daily=precipitation_sum,temperature_2m_mean,wind_speed_10m_max,wind_direction_10m_dominant&timezone=Europe%2FRome`;
        } else {
          const tDate = new Date(targetDateStr);
          const sDate = new Date(tDate);
          sDate.setDate(sDate.getDate() - 20);
          const startStr = sDate.toISOString().split('T')[0];
          url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&start_date=${startStr}&end_date=${targetDateStr}&daily=precipitation_sum,temperature_2m_mean,wind_speed_10m_max,wind_direction_10m_dominant&timezone=Europe%2FRome`;
        }

        const res = await fetch(url);
        if (!res.ok) return null;
        const data = await res.json();
        
        if (!data || !data.daily || !data.daily.precipitation_sum) return null;

        let missingInfoDays = 0;
        
        if (!isToday) {
          data.daily.precipitation_sum.forEach(v => {
            if (v === null) missingInfoDays++;
          });
        }

        const padArray = (arr, len, fillVal) => {
          let res = arr.map(v => v === null ? fillVal : v);
          while(res.length < len) {
            res.unshift(fillVal);
            if (!isToday && fillVal === 0) missingInfoDays++; 
          }
          return res.slice(-len);
        };

        const rainDays = padArray(data.daily.precipitation_sum, 21, 0);
        const tempDays = padArray(data.daily.temperature_2m_mean, 21, 15);
        const windSpeedDays = padArray(data.daily.wind_speed_10m_max, 21, 0);
        const windDirDays = padArray(data.daily.wind_direction_10m_dominant, 21, 0);

        const totalRain = rainDays.reduce((a, b) => a + b, 0);
        
        const goldenWindowRain = rainDays.slice(6, 15).reduce((a, b) => a + b, 0); 
        const recentRain = rainDays.slice(17, 21).reduce((a, b) => a + b, 0); 

        const recentTemps = tempDays.slice(-7);
        const avgTemp = recentTemps.reduce((a, b) => a + b, 0) / recentTemps.length;

        let goldenScore = 0;
        if (goldenWindowRain >= 30 && goldenWindowRain <= 90) goldenScore = 100;
        else if (goldenWindowRain > 5 && goldenWindowRain < 30) goldenScore = (goldenWindowRain - 5) * 4;
        else if (goldenWindowRain > 90) goldenScore = Math.max(0, 100 - (goldenWindowRain - 90));

        let totalRainScore = 0;
        if (totalRain >= 40 && totalRain <= 150) totalRainScore = 100;
        else if (totalRain > 10 && totalRain < 40) totalRainScore = (totalRain - 10) * 3.3;

        let tempScore = 0;
        if (avgTemp >= 12 && avgTemp <= 20) tempScore = 100;
        else if (avgTemp > 8 && avgTemp < 12) tempScore = (avgTemp - 8) * 25;
        else if (avgTemp > 20 && avgTemp < 26) tempScore = (26 - avgTemp) * 16.6;

        let combinedScore = (goldenScore * 0.60) + (tempScore * 0.30) + (totalRainScore * 0.10);

        const recentWindsSpeed = windSpeedDays.slice(-7);
        const recentWindsDir = windDirDays.slice(-7);
        const avgWindSpeed = recentWindsSpeed.reduce((a, b) => a + b, 0) / recentWindsSpeed.length;
        const avgWindDir = recentWindsDir.reduce((a, b) => a + b, 0) / recentWindsDir.length;

        const isDryWind = (avgWindDir >= 315 || avgWindDir <= 67);
        const isHumidWind = (avgWindDir > 135 && avgWindDir < 247);
        let windNote = "🌬️ Vento neutro";

        if (avgWindSpeed > 18 && isDryWind) {
          combinedScore = combinedScore * 0.75; 
          windNote = "💨 Tramontana/Secco (-25%)";
        } else if (avgWindSpeed <= 12 || isHumidWind) {
          combinedScore = Math.min(100, combinedScore * 1.10); 
          windNote = "🍃 Vento debole/Umido (+10%)";
        }

        let penaltyNote = "";
        if (!isToday && missingInfoDays > 0) {
          const penalty = missingInfoDays * 5;
          combinedScore -= penalty;
          penaltyNote = `⚠️ Incertezza previsione: penalità -${penalty}%`;
        }

        const finalScore = Math.min(100, Math.max(0, Math.round(combinedScore)));

        let predictionNote = "Fase stazionaria / Attesa";
        let predictionColor = "text-slate-500";
        if (recentRain > 30 && goldenWindowRain < 20) {
          predictionNote = "💧 Suolo appena bagnato: boom atteso tra 7-12 gg";
          predictionColor = "text-blue-600 font-bold";
        } else if (goldenWindowRain >= 30 && finalScore > 60) {
          predictionNote = "🍄 Piena Finestra di Fruttificazione!";
          predictionColor = "text-emerald-600 font-bold";
        } else if (totalRain < 15) {
          predictionNote = "🏜️ Terreno secco, in attesa di piogge.";
          predictionColor = "text-orange-600";
        }

        return { 
          totalRain: Math.round(totalRain), 
          recentRain: Math.round(recentRain),
          goldenWindowRain: Math.round(goldenWindowRain),
          predictionNote, predictionColor, penaltyNote,
          avgTemp: Math.round(avgTemp), 
          windSpeed: Math.round(avgWindSpeed), windNote,
          score: finalScore 
        };

      } catch (e) { return null; }
    }

    async function loadMeteoData() {
      for (const loc of locations) {
        const data = await getFungiScore(loc.lat, loc.lon);

        if (!data) continue;

        let color = '#dc2626'; let labelText = "Molto Basso";
        if (data.score > 20 && data.score <= 40) { color = '#f97316'; labelText = "Basso"; }
        else if (data.score > 40 && data.score <= 60) { color = '#f59e0b'; labelText = "Medio"; }
        else if (data.score > 60 && data.score <= 80) { color = '#16a34a'; labelText = "Buono"; }
        else if (data.score > 80) { color = '#34d399'; labelText = "Eccellente"; }

        const size = loc.type === "Provincia" ? 34 : 28;
        const markerIcon = L.divIcon({
          className: 'custom-score-icon',
          html: `<div class="score-marker" style="background-color: ${color}; width: ${size}px; height: ${size}px;">${data.score}%</div>`,
          iconSize: [size, size],
          iconAnchor: [size/2, size/2]
        });

        L.marker([loc.lat, loc.lon], { icon: markerIcon }).addTo(map).bindPopup(`
          <div class="text-slate-900 p-1 max-w-[240px]">
            <h3 class="font-bold text-sm border-b pb-1 mb-2">${loc.name} <span class="text-[10px] text-slate-500">(${loc.type})</span></h3>
            
            <div class="bg-slate-100 p-2 rounded-lg mb-2 text-center relative">
              <div class="text-xs text-slate-600">Probabilità Calcolata</div>
              <div class="text-xl font-black" style="color:${color}">${data.score}% (${labelText})</div>
              <div class="text-[10px] mt-1 ${data.predictionColor}">${data.predictionNote}</div>
              ${data.penaltyNote ? `<div class="text-[9px] mt-1 text-red-600 font-bold bg-red-100 p-1 rounded">${data.penaltyNote}</div>` : ''}
            </div>

            <div class="text-[11px] space-y-1.5 text-slate-700">
              <p><b>🌧️ Finestra d'Oro (-14 a -6gg):</b> ${data.goldenWindowRain} mm</p>
              <p><b>💧 Pioggia Recente (Ultimi 3gg):</b> ${data.recentRain} mm</p>
              <p><b>🌡️ Temp. Media:</b> ${data.avgTemp} °C</p>
              <p><b>💨 Vento:</b> ${data.windSpeed} km/h - ${data.windNote}</p>
            </div>
          </div>
        `);
      }
    }

    function refreshData() {
      map.eachLayer(layer => { if (layer instanceof L.Marker) map.removeLayer(layer); });
      loadMeteoData();
    }

    window.onload = verificaAccesso;
  </script>
</body>
</html>
