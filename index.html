<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fungoradar Italia</title>

  <!-- PWA Manifest & Colors -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Tailwind CSS & Leaflet CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Flatpickr CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://npmcdn.com/flatpickr/dist/l10n/it.js"></script>

  <!-- Database Esterno dei Comuni -->
  <script src="comuni_italia.js"></script>

  <style>
    #map { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; }
    .flatpickr-calendar.dark {
      background: #1e293b !important;
      border: 1px solid #475569 !important;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important;
    }
    .flatpickr-day.selected {
      background: #059669 !important;
      border-color: #059669 !important;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col h-screen overflow-hidden">

  <!-- Header Overlay Ottimizzato Mobile -->
  <div class="absolute top-2 left-2 right-2 sm:top-4 sm:left-4 sm:right-4 z-[1000] bg-slate-900/95 backdrop-blur-md border border-slate-700/50 p-2 sm:p-4 rounded-2xl shadow-xl">
    <div class="flex items-center justify-between gap-1 sm:gap-2">
      <div class="flex items-center space-x-2 min-w-0">
        <span class="text-xl sm:text-2xl flex-shrink-0">🍄</span>
        <div class="min-w-0">
          <h1 class="font-bold text-sm sm:text-lg leading-tight text-emerald-400 truncate">Fungoradar</h1>
          <p id="status-text" class="text-[9px] sm:text-[10px] text-slate-400 truncate">Tocca la mappa per censire uno spot</p>
        </div>
      </div>
      <div class="flex items-center space-x-1 flex-shrink-0">
        
        <!-- Date Picker -->
        <div class="relative flex items-center">
          <input type="text" id="targetDate" class="bg-slate-800 text-emerald-400 border border-slate-600 rounded-lg pl-1.5 pr-6 py-1 text-[11px] sm:text-xs font-bold shadow focus:outline-none focus:ring-2 focus:ring-emerald-500 w-[95px] sm:w-[115px] cursor-pointer text-center" readonly placeholder="Data">
          <svg class="w-3.5 h-3.5 text-emerald-400 absolute right-1.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
        </div>

        <!-- Configurazione GitHub -->
        <button onclick="configGitHub()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 p-1.5 rounded-lg text-xs sm:text-sm font-semibold shadow transition" title="Configura GitHub">
          ⚙️
        </button>
        
        <!-- Radar Live -->
        <button onclick="toggleRadar()" id="radar-btn" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 p-1.5 rounded-lg text-xs sm:text-sm font-semibold shadow transition" title="Radar Pioggia">
          📡
        </button>

        <!-- Ricarica -->
        <button onclick="refreshData()" class="bg-emerald-600 hover:bg-emerald-500 text-white p-1.5 rounded-lg text-xs sm:text-sm font-semibold shadow transition" title="Ricarica Dati">
          🔄
        </button>

        <!-- Logout / Blocca App -->
        <button onclick="logoutPIN()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-300 p-1.5 rounded-lg text-xs sm:text-sm font-semibold shadow transition" title="Blocca App">
          🔒
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL DETTAGLI STORICI -->
  <div id="details-modal" class="fixed inset-0 z-[2000] bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between">
        <div>
          <h3 id="modal-title" class="font-bold text-base text-emerald-400">Analisi Dettagliata</h3>
          <p id="modal-subtitle" class="text-xs text-slate-400">Storico ultimi 10 giorni</p>
        </div>
        <button onclick="closeDetailsModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg p-1.5 text-sm font-bold">✕</button>
      </div>
      <div id="modal-body" class="p-4 overflow-y-auto space-y-2.5 text-xs"></div>
      <div class="p-3 border-t border-slate-800 bg-slate-950/50 text-right">
        <button onclick="closeDetailsModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition">Chiudi</button>
      </div>
    </div>
  </div>

  <!-- MODAL AGGIUNGI SPOT -->
  <div id="add-spot-modal" class="fixed inset-0 z-[2500] bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-2xl shadow-2xl p-5 space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h3 class="font-bold text-sm text-emerald-400">📍 Censisci Nuovo Spot</h3>
        <button onclick="closeAddSpotModal()" class="text-slate-400 hover:text-white font-bold text-sm">✕</button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-slate-400 mb-1">Nome dello Spot</label>
          <input type="text" id="new-spot-name" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="Es. Faggeta Alta">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">Altitudine (m slm)</label>
          <input type="number" id="new-spot-alt" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="400">
        </div>
        <div class="flex items-center space-x-2 pt-1">
          <input type="checkbox" id="new-spot-fav" class="w-4 h-4 accent-emerald-500 rounded">
          <label for="new-spot-fav" class="text-slate-300 font-medium">Contrassegna come Preferito ⭐</label>
        </div>
      </div>
      <div class="flex space-x-2 pt-2">
        <button onclick="closeAddSpotModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-xl font-bold transition">Annulla</button>
        <button onclick="confirmAddSpot()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded-xl font-bold transition shadow">Salva su GitHub</button>
      </div>
    </div>
  </div>

  <!-- Map Container -->
  <div id="map" class="z-0"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    function refreshData() {
      if (typeof map !== 'undefined' && map) {
        Object.keys(activeMarkers).forEach(key => map.removeLayer(activeMarkers[key]));
        activeMarkers = {};
        loadMeteoData();
      } else {
        location.reload();
      }
    }

    function logoutPIN() {
      localStorage.removeItem("fungicast_auth");
      location.reload();
    }

    function configGitHub() {
      const user = prompt("Nome utente GitHub:", localStorage.getItem("gh_user") || "");
      const repo = prompt("Nome repository GitHub (es. fungoradar):", localStorage.getItem("gh_repo") || "");
      const token = prompt("Personal Access Token GitHub (Classic):", localStorage.getItem("gh_token") || "");

      if (user && repo && token) {
        localStorage.setItem("gh_user", user);
        localStorage.setItem("gh_repo", repo);
        localStorage.setItem("gh_token", token);
        alert("✅ Configurazione GitHub salvata!");
      }
    }

    function closeAddSpotModal() {
      document.getElementById('add-spot-modal').classList.add('hidden');
    }

    function closeDetailsModal() { 
      document.getElementById('details-modal').classList.add('hidden'); 
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW errore:', err));
    }

    const PIN_CORRETTO = "1234";
    let map;
    let activeMarkers = {};
    let meteoCache = {};
    let radarLayer = null;
    let isRadarActive = false;
    let pendingLat = null;
    let pendingLon = null;

    function initCustomCalendar() {
      try {
        const today = new Date();
        const maxDate = new Date(today.getTime() + 14 * 24 * 60 * 60 * 1000);
        flatpickr("#targetDate", {
          locale: "it",
          dateFormat: "Y-m-d",
          defaultDate: "today",
          maxDate: maxDate,
          disableMobile: true,
          onChange: function() { meteoCache = {}; refreshData(); }
        });
      } catch(e) {
        const offset = (new Date()).getTimezoneOffset() * 60000;
        document.getElementById('targetDate').value = (new Date(Date.now() - offset)).toISOString().split('T')[0];
      }
    }

    function verificaAccesso() {
      if (localStorage.getItem("fungicast_auth") === "true") {
        initCustomCalendar();
        initMap(); 
        return;
      }
      const pinInserito = prompt("🔒 Inserisci il PIN per accedere a FungiCast:");
      if (pinInserito === PIN_CORRETTO) {
        localStorage.setItem("fungicast_auth", "true");
        initCustomCalendar();
        initMap();
      } else {
        alert("❌ PIN errato!");
        document.body.innerHTML = `<div style="display:flex; justify-content:center; align-items:center; height:100vh; background:#0f172a; color:white;"><h2>Accesso Riservato</h2></div>`;
      }
    }

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([42.5, 12.5], 7);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(map);

      map.on('click', async function(e) {
        pendingLat = parseFloat(e.latlng.lat.toFixed(4));
        pendingLon = parseFloat(e.latlng.lng.toFixed(4));
        const statusText = document.getElementById("status-text");

        statusText.innerText = "🔍 Rilevamento automatico dati...";

        try {
          const geoRes = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pendingLat}&lon=${pendingLon}&zoom=14&addressdetails=1`);
          const geoData = await geoRes.json();
          let autoName = geoData.display_name ? (geoData.address.wood || geoData.address.suburb || geoData.address.village || geoData.address.town || "Spot Boscoso") : "Nuovo Spot";

          const eleRes = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${pendingLat}&longitude=${pendingLon}`);
          const eleData = await eleRes.json();
          const autoAlt = (eleData && eleData.elevation && eleData.elevation.length > 0) ? Math.round(eleData.elevation[0]) : 400;

          statusText.innerText = "Tocca la mappa per censire uno spot";

          document.getElementById('new-spot-name').value = autoName;
          document.getElementById('new-spot-alt').value = autoAlt;
          document.getElementById('new-spot-fav').checked = false;
          document.getElementById('add-spot-modal').classList.remove('hidden');

        } catch (err) {
          statusText.innerText = "Tocca la mappa per censire uno spot";
          document.getElementById('new-spot-name').value = "Spot Boscoso";
          document.getElementById('new-spot-alt').value = 400;
          document.getElementById('add-spot-modal').classList.remove('hidden');
        }
      });

      map.on('moveend zoomend', loadMeteoData);
      loadMeteoData();
    }

    async function confirmAddSpot() {
      const name = document.getElementById('new-spot-name').value.trim() || "Spot Boscoso";
      const alt = parseInt(document.getElementById('new-spot-alt').value) || 400;
      const isFavorite = document.getElementById('new-spot-fav').checked;

      closeAddSpotModal();

      const newSpotObj = {
        name: name,
        lat: pendingLat,
        lon: pendingLon,
        alt: alt,
        type: "Località",
        isFavorite: isFavorite,
        minZoom: 9
      };

      await commitNewSpotToGitHub(newSpotObj);
    }

    async function commitNewSpotToGitHub(newSpot) {
      const ghUser = localStorage.getItem("gh_user");
      const ghRepo = localStorage.getItem("gh_repo");
      const ghToken = localStorage.getItem("gh_token");

      if (!ghUser || !ghRepo || !ghToken) {
        alert("⚠️ Per salvare su GitHub configura prima Token, User e Repo cliccando sull'icona ingranaggio ⚙️ in alto.");
        configGitHub();
        return;
      }

      const path = "comuni_italia.js";
      const url = `https://api.github.com/repos/${ghUser}/${ghRepo}/contents/${path}`;

      try {
        const getFileRes = await fetch(url, { headers: { 'Authorization': `token ${ghToken}` } });
        if (!getFileRes.ok) throw new Error("Impossibile leggere comuni_italia.js da GitHub.");
        const fileData = await getFileRes.json();

        const contentBase64 = fileData.content.replace(/\n/g, '');
        const currentJsText = decodeURIComponent(escape(atob(contentBase64)));

        const lastIndex = currentJsText.lastIndexOf("];");
        if (lastIndex === -1) throw new Error("Struttura comuni_italia.js non valida.");

        const favProp = newSpot.isFavorite ? `, isFavorite: true` : ``;
        const newSpotJson = `,\n  { name: "${newSpot.name}", lat: ${newSpot.lat}, lon: ${newSpot.lon}, alt: ${newSpot.alt}, type: "Località"${favProp}, minZoom: 9 }\n];`;
        const updatedJsText = currentJsText.substring(0, lastIndex) + newSpotJson;

        const updatedBase64 = btoa(unescape(encodeURIComponent(updatedJsText)));

        const putRes = await fetch(url, {
          method: "PUT",
          headers: {
            'Authorization': `token ${ghToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: `🤖 Auto-add spot: ${newSpot.name}`,
            content: updatedBase64,
            sha: fileData.sha
          })
        });

        if (putRes.ok) {
          alert(`🚀 Spot "${newSpot.name}" (${newSpot.alt}m slm) salvato su GitHub!`);
          location.reload();
        } else {
          const errData = await putRes.json();
          alert("❌ Errore GitHub: " + (errData.message || "Verifica il token."));
        }

      } catch (err) {
        alert("❌ Errore salvataggio GitHub: " + err.message);
      }
    }

    async function toggleFavoriteSpot(spotName, lat, lon) {
      const ghUser = localStorage.getItem("gh_user");
      const ghRepo = localStorage.getItem("gh_repo");
      const ghToken = localStorage.getItem("gh_token");

      if (!ghUser || !ghRepo || !ghToken) {
        alert("⚠️ Configura prima l'ingranaggio ⚙️ in alto.");
        configGitHub();
        return;
      }

      const path = "comuni_italia.js";
      const url = `https://api.github.com/repos/${ghUser}/${ghRepo}/contents/${path}`;

      try {
        const getFileRes = await fetch(url, { headers: { 'Authorization': `token ${ghToken}` } });
        if (!getFileRes.ok) throw new Error("Impossibile leggere comuni_italia.js.");
        const fileData = await getFileRes.json();

        const contentBase64 = fileData.content.replace(/\n/g, '');
        let currentJsText = decodeURIComponent(escape(atob(contentBase64)));

        const locPattern = new RegExp(`name:\\s*"${spotName}"[^}]*}`);
        const match = currentJsText.match(locPattern);

        if (match) {
          let block = match[0];
          if (block.includes("isFavorite: true")) {
            block = block.replace(", isFavorite: true", "").replace("isFavorite: true,", "");
          } else {
            block = block.replace("type:", "isFavorite: true, type:");
          }
          currentJsText = currentJsText.replace(match[0], block);

          const updatedBase64 = btoa(unescape(encodeURIComponent(currentJsText)));

          const putRes = await fetch(url, {
            method: "PUT",
            headers: {
              'Authorization': `token ${ghToken}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: `⭐ Toggle favorite: ${spotName}`,
              content: updatedBase64,
              sha: fileData.sha
            })
          });

          if (putRes.ok) {
            alert(`⭐ Preferito aggiornato per "${spotName}"!`);
            location.reload();
          } else {
            alert("❌ Errore commit GitHub.");
          }
        } else {
          alert("❌ Spot non trovato.");
        }

      } catch (err) {
        alert("❌ Errore: " + err.message);
      }
    }

    async function toggleRadar() {
      const btn = document.getElementById('radar-btn');
      const statusText = document.getElementById("status-text");

      if (isRadarActive) {
        if (radarLayer) { map.removeLayer(radarLayer); radarLayer = null; }
        isRadarActive = false;
        btn.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-500');
        btn.classList.add('bg-slate-800', 'text-slate-300', 'border-slate-600');
        statusText.innerText = "Radar disattivato";
      } else {
        statusText.innerText = "📡 Caricamento Radar Live...";
        try {
          const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
          const data = await res.json();
          if (data && data.radar && data.radar.past && data.radar.past.length > 0) {
            const latestFrame = data.radar.past[data.radar.past.length - 1];
            const host = data.host || 'https://tilecache.rainviewer.com';
            const path = latestFrame.path;

            radarLayer = L.tileLayer(`${host}${path}/256/{z}/{x}/{y}/2/1_1.png`, {
              opacity: 0.75, 
              zIndex: 500,
              maxNativeZoom: 7,
              maxZoom: 18,
              attribution: 'Weather data by RainViewer (rainviewer.com)'
            }).addTo(map);

            isRadarActive = true;
            btn.classList.remove('bg-slate-800', 'text-slate-300', 'border-slate-600');
            btn.classList.add('bg-emerald-600', 'text-white', 'border-emerald-500');
            statusText.innerText = "📡 Radar Pioggia Attivo (Live)";
          } else {
            statusText.innerText = "⚠️ Nessun dato radar disponibile";
          }
        } catch(e) { 
          statusText.innerText = "Errore caricamento radar"; 
        }
      }
    }

    async function loadMeteoData() {
      const currentZoom = map.getZoom();
      const bounds = map.getBounds();
      const statusText = document.getElementById("status-text");
      const targetDateStr = document.getElementById('targetDate').value;

      if (typeof COMUNI_ITALIA === 'undefined') {
        statusText.innerText = "⚠️ Errore: comuni_italia.js non caricato";
        return;
      }

      const visibleLocs = COMUNI_ITALIA.filter(loc => {
        return currentZoom >= loc.minZoom && bounds.contains([loc.lat, loc.lon]);
      });

      if (!isRadarActive) statusText.innerText = `🍄 Caricamento ${visibleLocs.length} aree...`;

      await Promise.all(visibleLocs.map(async (loc) => {
        const altitude = loc.alt || 300;
        const cacheKey = `${loc.lat}_${loc.lon}_${altitude}_${targetDateStr}`;
        const locKey = `${loc.lat}_${loc.lon}`;
        
        if (!activeMarkers[locKey]) {
          const data = await getFungiScore(loc.lat, loc.lon, altitude);
          if (!data) return;

          let color = '#dc2626'; let labelText = "Molto Basso";
          if (data.score > 20 && data.score <= 40) { color = '#f97316'; labelText = "Basso"; }
          else if (data.score > 40 && data.score <= 60) { color = '#f59e0b'; labelText = "Medio"; }
          else if (data.score > 60 && data.score <= 80) { color = '#16a34a'; labelText = "Buono"; }
          else if (data.score > 80) { color = '#34d399'; labelText = "Eccellente"; }

          const size = loc.type === "Provincia" ? 34 : 30;

          let iconHtml = '';
          if (loc.isFavorite) {
            iconHtml = `
              <div style="position: relative; width: ${size+6}px; height: ${size+6}px; display: flex; align-items: center; justify-content: center;">
                <svg viewBox="0 0 24 24" style="position: absolute; width: 100%; height: 100%; fill: ${color}; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.6));">
                  <path d="M12 1.728l3.09 6.261 6.91 1.004-5 4.873 1.18 6.883-6.18-3.25-6.18 3.25 1.18-6.883-5-4.873 6.91-1.004z"/>
                </svg>
                <span style="position: relative; color: #ffffff; font-weight: 900; font-size: 9px; text-shadow: 0px 1px 3px #000; margin-top: 2px;">${data.score}%</span>
              </div>
            `;
          } else {
            iconHtml = `<div style="background-color: ${color}; width: ${size}px; height: ${size}px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #ffffff; font-weight: bold; font-size: 10px; border: 2px solid #ffffff; box-shadow: 0 2px 6px rgba(0,0,0,0.4); text-shadow: 0px 1px 2px rgba(0,0,0,0.8);">${data.score}%</div>`;
          }

          const markerIcon = L.divIcon({
            className: '',
            html: iconHtml,
            iconSize: [size+6, size+6],
            iconAnchor: [(size+6)/2, (size+6)/2]
          });

          const favText = loc.isFavorite ? "⭐ Rimuovi dai Preferiti" : "☆ Aggiungi ai Preferiti ⭐";

          const marker = L.marker([loc.lat, loc.lon], { icon: markerIcon }).addTo(map).bindPopup(`
            <div class="text-slate-900 p-1 max-w-[250px]">
              <h3 class="font-bold text-sm border-b pb-1 mb-2 flex items-center justify-between">
                <span>${loc.name} ${loc.isFavorite ? '⭐' : ''}</span>
                <span class="text-[10px] text-slate-500 font-normal">(${loc.type} - ⛰️ ${loc.alt}m)</span>
              </h3>
              <div class="bg-slate-100 p-2 rounded-lg mb-2 text-center relative">
                <div class="text-xs text-slate-600">Probabilità Calcolata</div>
                <div class="text-xl font-black" style="color:${color}">${data.score}% (${labelText})</div>
                <div class="text-[10px] mt-1 ${data.predictionColor}">${data.predictionNote}</div>
                ${data.seasonNote ? `<div class="text-[9px] mt-1 text-purple-700 font-bold bg-purple-100 p-1 rounded">${data.seasonNote}</div>` : ''}
                ${data.windDryNote ? `<div class="text-[9px] mt-1 text-red-700 font-bold bg-red-100 p-1 rounded">${data.windDryNote}</div>` : ''}
              </div>
              <div class="text-[11px] space-y-1.5 text-slate-700">
                <p><b>🌧️ Finestra d'Oro (-7 a -10gg):</b> ${data.goldenWindowRain} mm</p>
                <p><b>🌱 Umidità Suolo:</b> ${data.soilMoisture}%</p>
                <p><b>🌡️ Temp. Media:</b> ${data.avgTemp} °C (Min: ${data.avgMinTemp}°C)</p>
                <p><b>💨 Vento:</b> ${data.windSpeed} km/h - ${data.windNote}</p>
              </div>
              <div class="mt-3 pt-2 border-t border-slate-200 space-y-1.5 text-center">
                <button onclick="openDetailsModal('${loc.name.replace(/'/g, "\\'")}', '${cacheKey}')" class="bg-slate-900 hover:bg-emerald-700 text-white w-full py-1.5 px-3 rounded-lg text-xs font-bold transition shadow">
                  📊 Dettagli Storici (Card 10 Giorni)
                </button>
                <button onclick="toggleFavoriteSpot('${loc.name.replace(/'/g, "\\'")}', ${loc.lat}, ${loc.lon})" class="bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 w-full py-1 px-3 rounded-lg text-[10px] font-bold transition shadow">
                  ${favText}
                </button>
              </div>
            </div>
          `);

          activeMarkers[locKey] = marker;
        }
      }));

      Object.keys(activeMarkers).forEach(key => {
        const [lat, lon] = key.split('_').map(Number);
        if (!visibleLocs.some(loc => loc.lat === lat && loc.lon === lon)) {
          map.removeLayer(activeMarkers[key]);
          delete activeMarkers[key];
        }
      });

      if (!isRadarActive) statusText.innerText = `🍄 ${visibleLocs.length} aree visibili`;
    }

    function openDetailsModal(locationName, cacheKey) {
      const data = meteoCache[cacheKey];
      if (!data || !data.dailyHistory) return;

      document.getElementById('modal-title').innerText = `📊 Card Storiche: ${locationName}`;
      document.getElementById('modal-subtitle').innerText = `Punteggio Totale: ${data.score}% | Dati Ultimi 10 Giorni`;

      const modalBody = document.getElementById('modal-body');
      let html = `<div class="mb-3 p-2.5 bg-emerald-950/40 border border-emerald-800/50 rounded-xl text-[11px] text-emerald-300">🌿 <b>Finestra d'Oro (-7 a -10gg):</b> Giorni chiave per la spinta del micelio.</div><div class="space-y-2">`;

      data.dailyHistory.forEach((day) => {
        const isGolden = day.isGolden;
        const cardBg = isGolden ? 'bg-emerald-950/40 border-emerald-500 ring-1 ring-emerald-500/50' : 'bg-slate-800/50 border-slate-700/60';
        const badgeHtml = isGolden ? '<span class="bg-emerald-600 text-white text-[9px] px-2 py-0.5 rounded-full font-bold uppercase tracking-wider">🌿 Finestra d\'Oro</span>' : '<span class="text-slate-400 text-[10px]">Giornata Standard</span>';

        html += `
          <div class="p-3 rounded-xl border ${cardBg} transition flex flex-col space-y-1.5 shadow-sm">
            <div class="flex items-center justify-between border-b border-slate-700/50 pb-1.5">
              <span class="font-bold text-slate-200 text-xs">📅 ${day.date}</span>
              ${badgeHtml}
            </div>
            <div class="grid grid-cols-3 gap-2 pt-1 text-center">
              <div class="bg-slate-900/60 p-1.5 rounded-lg border border-slate-800">
                <div class="text-[10px] text-slate-400">Pioggia</div>
                <div class="font-bold text-xs ${day.rain > 5 ? 'text-blue-400' : 'text-slate-300'}">🌧️ ${day.rain} mm</div>
              </div>
              <div class="bg-slate-900/60 p-1.5 rounded-lg border border-slate-800">
                <div class="text-[10px] text-slate-400">Temperature</div>
                <div class="font-bold text-xs text-slate-200">🌡️ ${day.temp}°C <span class="text-[9px] text-slate-400">(${day.tempMin}°)</span></div>
              </div>
              <div class="bg-slate-900/60 p-1.5 rounded-lg border border-slate-800">
                <div class="text-[10px] text-slate-400">Vento Max</div>
                <div class="font-bold text-xs ${day.wind > 15 ? 'text-orange-400' : 'text-slate-300'}">💨 ${day.wind} km/h</div>
              </div>
            </div>
          </div>
        `;
      });

      html += `</div>`;
      modalBody.innerHTML = html;
      document.getElementById('details-modal').classList.remove('hidden');
    }

    async function getFungiScore(lat, lon, altitude = 300) {
      const targetDateStr = document.getElementById('targetDate').value;
      const cacheKey = `${lat}_${lon}_${altitude}_${targetDateStr}`;
      if (meteoCache[cacheKey]) return meteoCache[cacheKey];

      try {
        const todayObj = new Date();
        const offset = todayObj.getTimezoneOffset() * 60000;
        const localTodayStr = (new Date(todayObj - offset)).toISOString().split('T')[0];
        const isToday = (targetDateStr === localTodayStr);
        let url;

        const dailyParams = "precipitation_sum,temperature_2m_mean,temperature_2m_min,wind_speed_10m_max,wind_direction_10m_dominant";

        if (isToday) {
          url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&past_days=20&forecast_days=1&daily=${dailyParams}&timezone=Europe%2FRome`;
        } else {
          const tDate = new Date(targetDateStr);
          const sDate = new Date(tDate);
          sDate.setDate(sDate.getDate() - 20);
          url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&start_date=${sDate.toISOString().split('T')[0]}&end_date=${targetDateStr}&daily=${dailyParams}&timezone=Europe%2FRome`;
        }

        const res = await fetch(url);
        if (!res.ok) return null;
        const data = await res.json();
        if (!data || !data.daily || !data.daily.precipitation_sum) return null;

        const padArray = (arr, len, fillVal) => {
          let res = arr.map(v => v === null ? fillVal : v);
          while(res.length < len) res.unshift(fillVal);
          return res.slice(-len);
        };

        const timeDays = padArray(data.daily.time || [], 21, "2026-01-01");
        const rainDays = padArray(data.daily.precipitation_sum, 21, 0);
        const tempDays = padArray(data.daily.temperature_2m_mean, 21, 15);
        const tempMinDays = padArray(data.daily.temperature_2m_min, 21, 10);
        const windSpeedDays = padArray(data.daily.wind_speed_10m_max, 21, 0);
        const windDirDays = padArray(data.daily.wind_direction_10m_dominant, 21, 0);

        const totalRain = rainDays.reduce((a, b) => a + b, 0);
        const goldenWindowRain = rainDays.slice(10, 14).reduce((a, b) => a + b, 0); 
        const recentRain = rainDays.slice(17, 21).reduce((a, b) => a + b, 0); 

        const recentTemps = tempDays.slice(-7);
        const avgTemp = recentTemps.reduce((a, b) => a + b, 0) / recentTemps.length;
        const recentMinTemps = tempMinDays.slice(-7);
        const avgMinTemp = recentMinTemps.reduce((a, b) => a + b, 0) / recentMinTemps.length;

        const soilMoistureEst = Math.min(100, Math.max(10, Math.round((totalRain * 0.4 + recentRain * 1.5) / 1.2)));

        let goldenScore = 0;
        if (goldenWindowRain >= 25 && goldenWindowRain <= 70) goldenScore = 100;
        else if (goldenWindowRain > 5 && goldenWindowRain < 25) goldenScore = (goldenWindowRain - 5) * 5;
        else if (goldenWindowRain > 70) goldenScore = Math.max(0, 100 - (goldenWindowRain - 70));

        let soilScore = Math.min(100, soilMoistureEst * 1.5);

        let minIdealTemp = altitude >= 1000 ? 10 : (altitude <= 500 ? 13 : 12);
        let maxIdealTemp = altitude >= 1000 ? 17 : (altitude <= 500 ? 22 : 20);

        let tempScore = 0;
        if (avgTemp >= minIdealTemp && avgTemp <= maxIdealTemp) tempScore = 100;
        else if (avgTemp < minIdealTemp) tempScore = Math.max(0, 100 - (minIdealTemp - avgTemp) * 20);
        else if (avgTemp > maxIdealTemp) tempScore = Math.max(0, 100 - (avgTemp - maxIdealTemp) * 18);

        let totalRainScore = 0;
        if (totalRain >= 40 && totalRain <= 150) totalRainScore = 100;
        else if (totalRain > 10 && totalRain < 40) totalRainScore = (totalRain - 10) * 3.3;

        let combinedScore = (goldenScore * 0.45) + (soilScore * 0.20) + (tempScore * 0.20) + (totalRainScore * 0.15);

        // --- NUOVA LOGICA: BILANCIO IDRICO E VENTO SECCO CUMULATIVO POST-PIOGGIA ---
        let dryWindDaysCount = 0;
        // Analizziamo i giorni dal dopo-pioggia utile fino ad oggi (indici da 14 a 20)
        const postRainWinds = windSpeedDays.slice(14, 21);
        const postRainDirs = windDirDays.slice(14, 21);
        
        for(let k = 0; k < postRainWinds.length; k++) {
          const speed = postRainWinds[k];
          const dir = postRainDirs[k];
          // Vento da nord/nord-est (Tramontana / Grecale) superiore a 12 km/h asciuga fortemente il suolo
          if (speed > 12 && (dir >= 315 || dir <= 67)) {
            dryWindDaysCount++;
          }
        }

        let windNote = "🌬️ Vento neutro";
        let windDryNote = "";

        if (dryWindDaysCount >= 2) {
          const dryingPenalty = Math.max(0.4, 1.0 - (dryWindDaysCount * 0.12));
          combinedScore = combinedScore * dryingPenalty;
          windNote = `💨 Vento secco persistente (${dryWindDaysCount} giorni)`;
          windDryNote = `⚠️ Siccità da vento prolungato (${dryWindDaysCount}gg post-pioggia): suolo arido (-${Math.round((1-dryingPenalty)*100)}%)`;
        } else {
          // Controllo vento recente di oggi/ieri
          const recent3WindsSpeed = windSpeedDays.slice(-3);
          const recent3WindsDir = windDirDays.slice(-3);
          const avgRecentWindSpeed = recent3WindsSpeed.reduce((a, b) => a + b, 0) / recent3WindsSpeed.length;
          const avgRecentWindDir = recent3WindsDir.reduce((a, b) => a + b, 0) / recent3WindsDir.length;
          
          if (avgRecentWindSpeed > 14 && (avgRecentWindDir >= 315 || avgRecentWindDir <= 67)) {
            const dryingPenalty = (altitude <= 600) ? 0.60 : 0.75;
            combinedScore = combinedScore * dryingPenalty;
            windNote = "💨 Tramontana secca recente";
            windDryNote = `⚠️ Vento secco recente: suolo superficiale disidratato (-${Math.round((1-dryingPenalty)*100)}%)`;
          } else if (avgRecentWindSpeed <= 12) {
            combinedScore = Math.min(100, combinedScore * 1.08);
            windNote = "🍃 Vento debole protetto (+8%)";
          }
        }

        const finalScore = Math.min(100, Math.max(0, Math.round(combinedScore)));

        let predictionNote = "Fase stazionaria / Attesa";
        let predictionColor = "text-slate-500";
        if (recentRain > 30 && goldenWindowRain < 20) {
          predictionNote = "💧 Suolo appena bagnato: boom atteso tra 7-10 gg";
          predictionColor = "text-blue-600 font-bold";
        } else if (goldenWindowRain >= 25 && finalScore > 60) {
          predictionNote = "🍄 Piena Finestra di Fruttificazione!";
          predictionColor = "text-emerald-600 font-bold";
        } else if (dryWindDaysCount >= 3 || totalRain < 15) {
          predictionNote = "🏜️ Terreno arido per vento/siccità.";
          predictionColor = "text-orange-600";
        }

        const dailyHistory = [];
        for (let i = 11; i < 21; i++) {
          dailyHistory.push({
            date: timeDays[i] || `Giorno ${i}`,
            rain: Math.round(rainDays[i] * 10) / 10,
            temp: Math.round(tempDays[i]),
            tempMin: Math.round(tempMinDays[i]),
            wind: Math.round(windSpeedDays[i]),
            isGolden: (i >= 10 && i <= 13)
          });
        }

        const recent3WindsSpeed = windSpeedDays.slice(-3);
        const avgRecentWindSpeed = recent3WindsSpeed.reduce((a, b) => a + b, 0) / recent3WindsSpeed.length;

        const result = { 
          goldenWindowRain: Math.round(goldenWindowRain),
          soilMoisture: soilMoistureEst,
          predictionNote, predictionColor, windDryNote,
          avgTemp: Math.round(avgTemp), avgMinTemp: Math.round(avgMinTemp),
          windSpeed: Math.round(avgRecentWindSpeed), windNote,
          score: finalScore,
          dailyHistory
        };

        meteoCache[cacheKey] = result;
        return result;

      } catch (e) { return null; }
    }

    window.onload = verificaAccesso;
  </script>
